# Mypy configuration for the Atlas core package (Sprint 4 CI gate).
# Scope is src/atlas; google-cloud libraries ship without stubs.
# python_version matches the CI runtime (3.12). Runtime code still targets
# the Composer image's Python 3.11 — no 3.12-only syntax is used — but 3.11
# here makes mypy reject PEP 695 `type` statements in third-party stubs
# (e.g. numpy, present whenever Airflow is installed in the same venv).
[mypy]
python_version = 3.12
mypy_path = src
packages = atlas
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = True
