name: Import standalone Atlas template v2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/import-atlas-template-v2.yml"
      - ".template-import-v2/**"

permissions:
  contents: write

jobs:
  import:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-c0b8-81fd-8f10-08033a0b2e81/raw?se=2026-07-20T04:42:04Z&sp=r&sv=2026-02-06&sr=b&scid=31fbd183-0bc0-50ab-9882-234b4ef7e05d&skoid=2d2fbb03-9efb-4ad0-a91c-1db2f5a47997&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-19T11:36:12Z&ske=2026-07-21T11:36:12Z&sks=b&skv=2026-02-06&sig=4zMQFK8IAgeZRvqZXHOEGK%2BbITBXyYDNtMmW935CC8w%3D'
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false

      - name: Download and sanitize source snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$SOURCE_ARTIFACT_URL" \
            --output "$RUNNER_TEMP/atlas-source.zip"
          unzip -q "$RUNNER_TEMP/atlas-source.zip" -d "$RUNNER_TEMP/atlas-source"
          python - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ['RUNNER_TEMP']) / 'atlas-source' / 'atlas-template'
          replacements = {
              'vital-scout-479118-n7': 'example-gcp-project',
              '911571548652': '123456789012',
              'rlancaster243/DE-project-1': 'YOUR_GITHUB_OWNER/YOUR_REPOSITORY',
              'rlancaster243': 'YOUR_GITHUB_OWNER',
              'DE-project-1': 'Atlas-GCP-Build',
              'russell_lancaster243@gmail.com': '<operator-email>',
          }
          suffixes = {'.md', '.py', '.sh', '.yaml', '.yml', '.json', '.sql', '.txt', '.cfg', '.ini', '.toml'}
          for path in root.rglob('*'):
              if path.is_file() and path.suffix.lower() in suffixes:
                  text = path.read_text(encoding='utf-8', errors='ignore')
                  for old, new in replacements.items():
                      text = text.replace(old, new)
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Build and finalize standalone repository
        shell: bash
        run: |
          set -euo pipefail
          python .template-import/build_template.py \
            "$RUNNER_TEMP/atlas-source/atlas-template" \
            "$RUNNER_TEMP/atlas-output"
          python .template-import-v2/finalize.py "$RUNNER_TEMP/atlas-output"
          test -f "$RUNNER_TEMP/atlas-output/README.md"
          test -f "$RUNNER_TEMP/atlas-output/.github/workflows/atlas-ci.yml"
          test -f "$RUNNER_TEMP/atlas-output/scripts/validate_ci.sh"

      - name: Validate exported repository before import
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/atlas-output"
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          python -m compileall -q src scripts dags tests
          python -m pip install --quiet PyYAML pytest
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = list(Path('.github/workflows').glob('*.yml'))
          paths += list(Path('config').rglob('*.yml'))
          paths += list(Path('config').rglob('*.yaml'))
          for path in paths:
              yaml.safe_load(path.read_text(encoding='utf-8'))
          print(f'parsed {len(paths)} YAML files')
          PY
          python -m pytest \
            tests/acceptance/test_sprint2_dbt_environment.py \
            tests/acceptance/test_sprint2_dbt_warehouse.py -q
          ! grep -RIlE \
            'vital-scout-479118-n7|911571548652|rlancaster243|DE-project-1|russell_lancaster243@gmail.com' .

      - name: Import non-workflow repository contents
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='LICENSE' \
            --exclude='.github/workflows/' \
            "$RUNNER_TEMP/atlas-output/" ./
          test -f LICENSE
          test ! -e .template-import
          test ! -e .template-import-v2
          git diff --check

      - name: Commit and push non-workflow template contents
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git status --short
            git diff --cached --quiet && { echo 'No import changes produced'; exit 1; }
            git commit -m 'feat: import standalone Atlas production template'
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          ) >"$RUNNER_TEMP/commit-push.log" 2>&1
          status=$?
          tail -100 "$RUNNER_TEMP/commit-push.log"
          exit "$status"

      - name: Upload commit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-template-commit-diagnostics
          path: ${{ runner.temp }}/commit-push.log
          if-no-files-found: warn
          retention-days: 2
