name: Diagnose Atlas reference fix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-atlas-reference-fix.yml"

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-5d54-81f5-892b-988108bc074f/raw?se=2026-07-20T05:06:34Z&sp=r&sv=2026-02-06&sr=b&scid=f451e15e-c000-51ad-b0da-ec4488323048&skoid=2d2fbb03-9efb-4ad0-a91c-1db2f5a47997&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-20T00:25:01Z&ske=2026-07-22T00:25:01Z&sks=b&skv=2026-02-06&sig=ebTS%2B3P8T8KbWYUpj1OG0xXhTGG4WwRPZFF3m7YSLPo%3D'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install minimum dependencies
        run: pip install PyYAML
      - name: Apply repair in worktree
        run: |
          curl --fail --location --silent --show-error "$SOURCE_URL" -o "$RUNNER_TEMP/source.zip"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/source"
          python .template-fix/fix.py
      - name: Capture reference validation
        shell: bash
        run: |
          mkdir -p diagnostics
          set +e
          PYTHONPATH=src python -m atlas.reference.validate > diagnostics/reference.log 2>&1
          echo "$?" > diagnostics/reference.exit
          cat diagnostics/reference.log
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-reference-fix-diagnostics
          path: diagnostics/
          retention-days: 2
