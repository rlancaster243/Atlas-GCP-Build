name: Apply Atlas extraction fix v2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-atlas-extraction-fix-v2.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-9bfc-81fd-8c22-cee755f4a2e4/raw?se=2026-07-20T05:03:35Z&sp=r&sv=2026-02-06&sr=b&scid=7ea2dce1-a83c-59b5-83c1-5798bf8d2d2d&skoid=2d2fbb03-9efb-4ad0-a91c-1db2f5a47997&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-19T13:50:33Z&ske=2026-07-21T13:50:33Z&sks=b&skv=2026-02-06&sig=xm1rbgEEyB%2Bp9VQg0%2BWlHpsXk6NbU7mgh%2BjRF4dupPg%3D'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - name: Install validation dependencies
        run: pip install -r requirements.txt -r requirements-ci.txt
      - name: Download source snapshot
        run: |
          curl --fail --location --silent --show-error "$SOURCE_URL" -o "$RUNNER_TEMP/source.zip"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/source"
          test -d "$RUNNER_TEMP/source/atlas-template"
      - name: Apply and validate repair
        run: |
          python .template-fix/fix.py
          export PYTHONPATH=src:dags
          python -m atlas.reference.validate
          python scripts/validate_public_extraction.py
          python -m pytest tests/airflow/test_sprint4_hygiene.py -q
          python -m pytest tests/unit tests/airflow -q
          ! grep -RIlE 'vital-scout-479118-n7|911571548652|rlancaster243|DE-project-1|russell_lancaster243@gmail.com' \
            --exclude-dir=.git \
            --exclude='apply-atlas-extraction-fix.yml' \
            --exclude='apply-atlas-extraction-fix-v2.yml' \
            --exclude='fix-atlas-extraction.yml' \
            --exclude='fix-atlas-extraction-v2.yml' \
            --exclude='atlas-diagnostics.yml' .
          git diff --check
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete standalone reference and extraction contracts'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
