name: atlas-integration

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Commit SHA reachable from main; empty uses main HEAD"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: atlas-integration
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  atlas-gcp-integration:
    name: atlas-gcp-integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve trusted target
        id: target
        run: |
          target="${{ github.event.inputs.target_sha }}"
          if [ -z "$target" ]; then
            target="$(git rev-parse HEAD)"
          fi
          git cat-file -e "${target}^{commit}"
          git merge-base --is-ancestor "$target" origin/main
          git checkout "$target"
          echo "sha=$target" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dbt/requirements-dbt.txt
      - name: Install runtime and dbt toolchains
        run: |
          pip install -r requirements.txt
          python -m venv /tmp/dbt-venv
          /tmp/dbt-venv/bin/pip install -r dbt/requirements-dbt.txt
          echo "/tmp/dbt-venv/bin" >> "$GITHUB_PATH"
      - name: Require WIF repository variables
        run: |
          test -n "${{ vars.ATLAS_WIF_PROVIDER }}" || { echo "Set ATLAS_WIF_PROVIDER"; exit 1; }
          test -n "${{ vars.ATLAS_INTEGRATION_SERVICE_ACCOUNT }}" || { echo "Set ATLAS_INTEGRATION_SERVICE_ACCOUNT"; exit 1; }
      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.ATLAS_WIF_PROVIDER }}
          service_account: ${{ vars.ATLAS_INTEGRATION_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Run isolated integration test
        run: bash scripts/validate_gcp_integration.sh
      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-results
          path: logs/ci/integration-results.json
