name: Import standalone Atlas template

on:
  pull_request:
    branches: [main]
    paths:
      - ".template-import/**"
      - ".github/workflows/import-atlas-template.yml"

permissions:
  contents: write

jobs:
  import:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_ARTIFACT_URL: 'https://sdmntprwestus3.oaiusercontent.com/files/00000000-4774-81fd-9b8b-289d09d5dec1/raw?se=2026-07-20T04:34:37Z&sp=r&sv=2026-02-06&sr=b&scid=1760b602-778d-5173-8939-b600081cd26a&skoid=2d2fbb03-9efb-4ad0-a91c-1db2f5a47997&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-20T00:28:56Z&ske=2026-07-22T00:28:56Z&sks=b&skv=2026-02-06&sig=ffbc/IAeH7ElAxwKlr7y%2BMytIuaIA23MBAc0b1RNbO4%3D'
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false

      - name: Download private source snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "$SOURCE_ARTIFACT_URL" \
            --output "$RUNNER_TEMP/atlas-source.zip"
          unzip -q "$RUNNER_TEMP/atlas-source.zip" -d "$RUNNER_TEMP/atlas-source"
          test -f "$RUNNER_TEMP/atlas-source/atlas-template/README.md"
          test -f "$RUNNER_TEMP/atlas-source/atlas-template/START_HERE.md"

      - name: Pre-sanitize source snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os

          source = Path(os.environ['RUNNER_TEMP']) / 'atlas-source' / 'atlas-template'
          replacements = {
              'vital-scout-479118-n7': 'example-gcp-project',
              '911571548652': '123456789012',
              'rlancaster243/DE-project-1': 'YOUR_GITHUB_OWNER/YOUR_REPOSITORY',
              'rlancaster243': 'YOUR_GITHUB_OWNER',
              'DE-project-1': 'Atlas-GCP-Build',
              'russell_lancaster243@gmail.com': '<operator-email>',
          }
          suffixes = {'.md', '.py', '.sh', '.yaml', '.yml', '.json', '.sql', '.txt', '.cfg', '.ini', '.toml'}
          for path in source.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in suffixes:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          print('source snapshot pre-sanitized')
          PY

      - name: Build reusable standalone repository
        shell: bash
        run: |
          set -euo pipefail
          if ! python .template-import/build_template.py \
            "$RUNNER_TEMP/atlas-source/atlas-template" \
            "$RUNNER_TEMP/atlas-output" \
            >"$RUNNER_TEMP/build-template.log" 2>&1; then
            echo 'Template build failed:'
            tail -40 "$RUNNER_TEMP/build-template.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/build-template.log"
          test -f "$RUNNER_TEMP/atlas-output/README.md"
          test -f "$RUNNER_TEMP/atlas-output/.github/workflows/atlas-ci.yml"
          test -f "$RUNNER_TEMP/atlas-output/scripts/validate_ci.sh"

      - name: Replace migration branch contents
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='LICENSE' \
            "$RUNNER_TEMP/atlas-output/" ./
          test -f LICENSE
          test ! -e .template-import
          test ! -e .github/workflows/import-atlas-template.yml

      - name: Validate exported repository
        shell: bash
        run: |
          set +e
          (
            set -euo pipefail
            find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
            python -m compileall -q src scripts dags tests
            python -m pip install --quiet PyYAML pytest
            python - <<'PY'
          from pathlib import Path
          import yaml

          paths = list(Path('.github/workflows').glob('*.yml'))
          paths += list(Path('config').rglob('*.yml'))
          paths += list(Path('config').rglob('*.yaml'))
          for path in paths:
              yaml.safe_load(path.read_text(encoding='utf-8'))
          print(f'parsed {len(paths)} YAML files')
          PY
            python -m pytest \
              tests/acceptance/test_sprint2_dbt_environment.py \
              tests/acceptance/test_sprint2_dbt_warehouse.py -q
            ! grep -RIlE \
              'vital-scout-479118-n7|911571548652|rlancaster243|DE-project-1|russell_lancaster243@gmail.com' \
              --exclude-dir=.git .
            git diff --check
          ) >"$RUNNER_TEMP/template-validation.log" 2>&1
          status=$?
          tail -80 "$RUNNER_TEMP/template-validation.log"
          exit "$status"

      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-template-migration-diagnostics
          path: |
            ${{ runner.temp }}/build-template.log
            ${{ runner.temp }}/template-validation.log
          if-no-files-found: warn
          retention-days: 2

      - name: Commit standalone template
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No import changes produced'; exit 1; }
          git commit -m 'feat: import standalone Atlas production template'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
