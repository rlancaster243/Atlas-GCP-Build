name: Apply Atlas extraction fix v4

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/apply-atlas-extraction-fix-v4.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_URL: 'https://sdmntprwestus2.oaiusercontent.com/files/00000000-7934-81f8-97a6-fb224cf2e1cd/raw?se=2026-07-20T05:09:12Z&sp=r&sv=2026-02-06&sr=b&scid=07a123d3-e33d-56d1-b8ce-542251cc9a58&skoid=2d2fbb03-9efb-4ad0-a91c-1db2f5a47997&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-07-20T02:10:08Z&ske=2026-07-22T02:10:08Z&sks=b&skv=2026-02-06&sig=DNce7kWaxdZCgCDJAiEWRGRmq2SOfcnH8vykHCplj5Q%3D'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-ci.txt
      - name: Download source snapshot
        run: |
          curl --fail --location --silent --show-error "$SOURCE_URL" -o "$RUNNER_TEMP/source.zip"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/source"
          test -d "$RUNNER_TEMP/source/atlas-template"
      - name: Apply repair
        run: python .template-fix/fix.py
      - name: Validate reference, README, and test suite
        env:
          PYTHONPATH: src:dags
        run: |
          python -m atlas.reference.validate
          python -m pytest tests/airflow/test_sprint4_hygiene.py -q
          python -m pytest tests/unit tests/airflow -q
          git diff --check
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete standalone reference and extraction contracts'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
