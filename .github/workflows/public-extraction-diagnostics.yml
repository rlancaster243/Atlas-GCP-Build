name: public-extraction-diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/public-extraction-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      - name: Capture scanner report
        shell: bash
        run: |
          mkdir -p diagnostics
          set +e
          python scripts/validate_public_extraction.py > diagnostics/public-extraction.log 2>&1
          echo "$?" > diagnostics/public-extraction.exit
          cat diagnostics/public-extraction.log
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-extraction-diagnostics
          path: diagnostics/
          retention-days: 2
