# Atlas non-dbt asset registry (Sprint 7, ADR-016).
# Authoritative governance metadata for assets NOT owned by dbt: raw/operational
# tables, buckets, DAGs, dashboards, and log resources. dbt models are governed
# by their dbt `meta` blocks and must NOT be duplicated here.
#
# Every asset must declare all policy.required_fields. `last_reviewed` is an
# ISO date. `contract_version` uses semver-like "major.minor".

version: 1

assets:
  # ---- Raw landing ----
  - asset_id: atlas_raw.events
    asset_type: raw_table
    purpose: Immutable landed synthetic events; source of truth for rebuilds.
    technical_owner: atlas-data-eng
    business_owner_or_role: atlas-platform
    grain: one row per landed event record (event_id may repeat across batches)
    source: scripts/generate_events.py -> GCS JSONL -> load_events.py
    consumers: [warehouse_reconciliation, atlas_dbt_staging]
    classification: INTERNAL
    retention_class: raw_landing
    freshness_expectation: daily batch (scheduled 06:00 UTC)
    contract_version: "1.0"
    lifecycle_status: ACTIVE
    repository_path: scripts/load_events.py
    runbook: docs/runbook-sprint3.md
    last_reviewed: "2026-07-19"

  # ---- Operational audit tables ----
  - asset_id: atlas_ops.pipeline_runs
    asset_type: operational_table
    purpose: Durable per-pipeline-run audit (status, timing, git_sha).
    technical_owner: atlas-data-eng
    business_owner_or_role: atlas-platform
    grain: one row per pipeline_run_id
    source: sql/create_pipeline_runs_table.sql (migration 001)
    consumers: [atlas_operations_dashboard, atlas_observability_monitor, alerting]
    classification: INTERNAL
    retention_class: operational_audit
    freshness_expectation: per pipeline run
    contract_version: "1.0"
    lifecycle_status: ACTIVE
    repository_path: src/atlas/ops/audit.py
    runbook: docs/runbook-sprint3.md
    last_reviewed: "2026-07-19"

  - asset_id: atlas_ops.task_events
    asset_type: operational_table
    purpose: Per-task lifecycle events with timing provenance.
    technical_owner: atlas-data-eng
    business_owner_or_role: atlas-platform
    grain: one row per (pipeline_run_id, task_id, attempt_number, event_type)
    source: migration 004 (+ 008 timing columns)
    consumers: [atlas_operations_dashboard]
    classification: INTERNAL
    retention_class: operational_audit
    freshness_expectation: per task attempt
    contract_version: "1.1"
    lifecycle_status: ACTIVE
    repository_path: src/atlas/ops/task_events.py
    runbook: docs/observability-runbook-sprint5.md
    last_reviewed: "2026-07-19"

  - asset_id: atlas_ops.quality_results
    asset_type: operational_table
    purpose: Durable warehouse-quality check results per run.
    technical_owner: atlas-data-eng
    business_owner_or_role: atlas-platform
    grain: one row per (pipeline_run_id, check_name)
    source: migration 005
    consumers: [atlas_operations_dashboard, atlas_observability_monitor]
    classification: INTERNAL
    retention_class: operational_audit
    freshness_expectation: per run
    contract_version: "1.0"
    lifecycle_status: ACTIVE
    repository_path: src/atlas/ops/quality_results.py
    runbook: docs/observability-runbook-sprint5.md
    last_reviewed: "2026-07-19"

  - asset_id: atlas_ops.monitor_evaluations
    asset_type: operational_table
    purpose: Observability monitor check evaluations.
    technical_owner: atlas-observability
    business_owner_or_role: atlas-platform
    grain: one row per (evaluation_id, check_name)
    source: migration 006
    consumers: [atlas_operations_dashboard, alerting]
    classification: INTERNAL
    retention_class: operational_audit
    freshness_expectation: per monitor run (~30 min cadence)
    contract_version: "1.0"
    lifecycle_status: ACTIVE
    repository_path: src/atlas/observability/monitor.py
    runbook: docs/observability-runbook-sprint5.md
    last_reviewed: "2026-07-19"

  - asset_id: atlas_ops.deployments
    asset_type: operational_table
    purpose: Deployment ledger (git_sha, deployment_id, stage outcomes).
    technical_owner: atlas-cicd
    business_owner_or_role: atlas-platform
    grain: one row per deployment_id
    source: migration 003
    consumers: [atlas_operations_dashboard]
    classification: INTERNAL
    retention_class: operational_audit
    freshness_expectation: per deployment
    contract_version: "1.0"
    lifecycle_status: ACTIVE
    repository_path: src/atlas/ops/deployments.py
    runbook: docs/ci-cd-runbook-sprint4.md
    last_reviewed: "2026-07-19"

  - asset_id: atlas_ops.schema_migrations
    asset_type: operational_table
    purpose: Applied-migration ledger with checksums (immutability guard).
    technical_owner: atlas-cicd
    business_owner_or_role: atlas-platform
    grain: one row per migration_id
    source: src/atlas/ops/migrations.py
    consumers: [warehouse_reconciliation]
    classification: INTERNAL
    retention_class: operational_audit
    freshness_expectation: per migration apply
    contract_version: "1.0"
    lifecycle_status: ACTIVE
    repository_path: src/atlas/ops/migrations.py
    runbook: docs/ci-cd-runbook-sprint4.md
    last_reviewed: "2026-07-19"

  - asset_id: atlas_ops.recovery_actions
    asset_type: operational_table
    purpose: Durable recovery-action audit (SUCCESS requires VERIFIED).
    technical_owner: atlas-data-eng
    business_owner_or_role: atlas-platform
    grain: one row per recovery_id
    source: migration 007
    consumers: [atlas_operations_dashboard]
    classification: INTERNAL
    retention_class: operational_audit
    freshness_expectation: per recovery action
    contract_version: "1.0"
    lifecycle_status: ACTIVE
    repository_path: src/atlas/ops/recovery_actions.py
    runbook: docs/recovery-runbook-sprint6.md
    last_reviewed: "2026-07-19"

  # ---- Buckets ----
  - asset_id: gcs://atlas-raw-events-example-gcp-project
    asset_type: bucket
    purpose: Raw event JSONL landing bucket (run-scoped immutable paths).
    technical_owner: atlas-data-eng
    business_owner_or_role: atlas-platform
    grain: one object per (event_date, batch_id) raw JSONL
    source: scripts/upload_events.py
    consumers: [warehouse_reconciliation]
    classification: INTERNAL
    retention_class: raw_landing
    freshness_expectation: per batch
    contract_version: "1.0"
    lifecycle_status: ACTIVE
    repository_path: scripts/upload_events.py
    runbook: docs/runbook-sprint3.md
    last_reviewed: "2026-07-19"

  - asset_id: gcs://atlas-deployments-example-gcp-project
    asset_type: bucket
    purpose: Immutable release bundles (tar.gz + checksum + manifest).
    technical_owner: atlas-cicd
    business_owner_or_role: atlas-platform
    grain: one prefix per git_sha release
    source: scripts/build_deployment_bundle.sh
    consumers: [atlas_github_deployer]
    classification: INTERNAL
    retention_class: release_evidence
    freshness_expectation: per release
    contract_version: "1.0"
    lifecycle_status: ACTIVE
    repository_path: scripts/build_deployment_bundle.sh
    runbook: docs/ci-cd-runbook-sprint4.md
    last_reviewed: "2026-07-19"

  # ---- DAGs ----
  - asset_id: dag.atlas_batch_pipeline
    asset_type: dag
    purpose: End-to-end batch ELT orchestration with audit and retries.
    technical_owner: atlas-data-eng
    business_owner_or_role: atlas-platform
    grain: one DAG run per (processing_date, batch_id)
    source: dags/atlas_batch_pipeline.py
    consumers: [warehouse_reconciliation]
    classification: INTERNAL
    retention_class: canonical_warehouse
    freshness_expectation: daily 06:00 UTC
    contract_version: "1.0"
    lifecycle_status: ACTIVE
    repository_path: dags/atlas_batch_pipeline.py
    runbook: docs/runbook-sprint3.md
    last_reviewed: "2026-07-19"

  - asset_id: dag.atlas_observability_monitor
    asset_type: dag
    purpose: Periodic health checks feeding metrics and alerts.
    technical_owner: atlas-observability
    business_owner_or_role: atlas-platform
    grain: one DAG run per monitor cadence
    source: dags/atlas_observability_monitor.py
    consumers: [alerting, atlas_operations_dashboard]
    classification: INTERNAL
    retention_class: operational_audit
    freshness_expectation: ~30 min cadence
    contract_version: "1.0"
    lifecycle_status: ACTIVE
    repository_path: dags/atlas_observability_monitor.py
    runbook: docs/observability-runbook-sprint5.md
    last_reviewed: "2026-07-19"

  # ---- Dashboard ----
  - asset_id: dashboard.atlas_operations
    asset_type: dashboard
    purpose: Operational visibility across pipeline, quality, and cost.
    technical_owner: atlas-observability
    business_owner_or_role: atlas-platform
    grain: one dashboard
    source: observability/dashboards/atlas-operations.json
    consumers: [atlas_platform_operators]
    classification: INTERNAL
    retention_class: observability_logs
    freshness_expectation: live
    contract_version: "1.0"
    lifecycle_status: ACTIVE
    repository_path: observability/dashboards/atlas-operations.json
    runbook: docs/observability-runbook-sprint5.md
    last_reviewed: "2026-07-19"

  # ---- Log resources ----
  - asset_id: logging.atlas_observability_bucket
    asset_type: log_resource
    purpose: Cloud Logging bucket + sink + view + linked dataset atlas_logs.
    technical_owner: atlas-observability
    business_owner_or_role: atlas-platform
    grain: one log bucket / linked dataset
    source: observability/logging/*.json
    consumers: [atlas_operations_dashboard, atlas_platform_operators]
    classification: INTERNAL
    retention_class: observability_logs
    freshness_expectation: live (30-day retention)
    contract_version: "1.0"
    lifecycle_status: ACTIVE
    repository_path: observability/logging/log-bucket.json
    runbook: docs/observability-runbook-sprint5.md
    last_reviewed: "2026-07-19"
