# Atlas Sprint 6 controlled failure-scenario catalog (ADR-013).
#
# Consumed by src/atlas/failure_injection/registry.py, which validates every
# scenario against the required schema in CI. Scenarios NEVER run implicitly:
# scripts/run_failure_scenario.sh requires an explicit scenario id, explicit
# environment, and ATLAS_APPROVE_FAILURE_INJECTION=true, and refuses
# canonical batch ids (only the atlas-s6- prefix is injectable).
#
# execution_mode:
#   unit  — behavior proven by repository tests (path given in evidence_hint)
#   live  — requires the ephemeral Composer/GCP game-day window
#   both  — unit-tested logic plus a live game-day execution

version: 1

defaults:
  environment: atlas-dev
  batch_prefix: atlas-s6-
  approval_required: [ATLAS_APPROVE_FAILURE_INJECTION]
  maximum_duration_minutes: 30
  maximum_cost_usd: 0.50

scenarios:
  # ---------------------------------------------------------------- INGESTION
  S6-ING-001:
    category: INGESTION
    description: Missing source artifact — expected JSONL absent at load time
    risk_level: LOW
    target_component: upload_events / load_events boundary
    preconditions: [isolated batch id, no canonical writes]
    injection_method: point load_events at a GCS URI that was never uploaded
    expected_detection: load step fails; task_events FAILED; pipeline_runs FAILED
    expected_alert: "Atlas: pipeline failed"
    expected_containment: no raw mutation, no success marker, downstream blocked
    allowed_data_impact: none (isolated batch only)
    recovery_action: RERUN_BATCH
    verification_queries:
      - raw count for batch equals 50000 after recovery rerun
      - no duplicate event_ids in raw for batch
    cleanup: delete isolated batch rows and GCS prefix
    recurrence_prevention: covered by existing exact-count load validation
    execution_mode: live
    maximum_duration_minutes: 30
    maximum_cost_usd: 0.10

  S6-ING-002:
    category: INGESTION
    description: Corrupt JSONL artifact fails parsing/loading without publication
    risk_level: MEDIUM
    target_component: BigQuery raw load
    preconditions: [isolated batch id, isolated GCS prefix]
    injection_method: upload a deliberately truncated/garbled JSONL to the isolated prefix
    expected_detection: load job error; sanitized error in task_events; FAILED audit
    expected_alert: "Atlas: pipeline failed"
    expected_containment: invalid artifact preserved for forensics; no curated publication; no raw payload in logs
    allowed_data_impact: none (isolated batch only)
    recovery_action: QUARANTINE_BATCH then RERUN_BATCH
    verification_queries:
      - regenerated artifact checksum matches deterministic expectation
      - raw count equals 50000 after rerun; zero rows from corrupt object
    cleanup: quarantined object moved/labeled; isolated rows deleted
    recurrence_prevention: checksum verification before load (existing) + regression test
    execution_mode: live
    maximum_cost_usd: 0.10

  S6-ING-003:
    category: INGESTION
    description: Checksum conflict on immutable GCS path is rejected
    risk_level: LOW
    target_component: upload_events create-only GCS semantics
    preconditions: [isolated batch id with existing object]
    injection_method: attempt second upload with different content for the same batch path
    expected_detection: upload rejected (precondition failure); original generation unchanged
    expected_alert: none required (blocked before any pipeline impact)
    expected_containment: original object generation preserved; batch history intact
    allowed_data_impact: none
    recovery_action: MANUAL_CONTAINMENT
    verification_queries:
      - GCS object generation unchanged after conflict attempt
    cleanup: none (nothing was mutated)
    recurrence_prevention: create-only upload contract regression test
    execution_mode: both
    evidence_hint: tests/unit test for upload precondition + live generation check
    maximum_cost_usd: 0.01

  S6-ING-004:
    category: INGESTION
    description: Partial raw load detected and repaired without duplication
    risk_level: HIGH
    target_component: raw load validation
    preconditions: [isolated batch id, ATLAS_APPROVE_DESTRUCTIVE_FIXTURE]
    injection_method: delete a slice of the isolated batch's raw rows after load
    expected_detection: exact-count validation fails; run FAILED; partial state visible
    expected_alert: "Atlas: pipeline failed"
    expected_containment: no warehouse publication for the partial batch
    allowed_data_impact: isolated batch rows only
    recovery_action: REPAIR_PARTIAL_LOAD
    verification_queries:
      - raw count equals 50000 exactly after repair
      - zero duplicate event_ids for batch
      - accepted + rejected equals raw after rerun
    cleanup: delete isolated batch data
    recurrence_prevention: exact-count gate (existing) + partial-repair runbook
    execution_mode: live
    approval_required: [ATLAS_APPROVE_FAILURE_INJECTION, ATLAS_APPROVE_DESTRUCTIVE_FIXTURE]
    maximum_cost_usd: 0.20

  S6-ING-005:
    category: INGESTION
    description: Duplicate execution of the same batch does not duplicate data
    risk_level: MEDIUM
    target_component: batch idempotency (GCS reuse + raw load skip + dbt incremental)
    preconditions: [isolated batch id already loaded]
    injection_method: trigger a second pipeline run with the identical batch id/seed
    expected_detection: second run reuses immutable object; load skipped/reconciled
    expected_alert: none (idempotency is expected behavior)
    expected_containment: facts unique; marts stable; two distinct pipeline_run_id rows
    allowed_data_impact: none
    recovery_action: RESET_MONITOR
    verification_queries:
      - raw count unchanged after duplicate execution
      - fact event_ids unique for batch
      - two pipeline_runs rows exist for the batch
    cleanup: none
    recurrence_prevention: idempotency regression suite (existing Sprint 3/4 tests)
    execution_mode: live
    maximum_cost_usd: 0.10

  S6-ING-006:
    category: INGESTION
    description: Transient GCS failure retries and reconciles
    risk_level: LOW
    target_component: upload step retry policy
    preconditions: [isolated batch id]
    injection_method: upload_once context flag (existing controlled --fail-once path)
    expected_detection: attempt 1 fails, RETRY task event, attempt 2 succeeds
    expected_alert: none (recovered within retry policy)
    expected_containment: single final object; no partial artifacts
    allowed_data_impact: none
    recovery_action: RETRY_TASK
    verification_queries:
      - task_events has attempt 1 FAILED/RETRY and attempt 2 SUCCESS for upload task
    cleanup: none
    recurrence_prevention: retry-policy tests (existing)
    execution_mode: live
    maximum_cost_usd: 0.05

  S6-ING-007:
    category: INGESTION
    description: Transient BigQuery failure retries without duplicate load
    risk_level: MEDIUM
    target_component: raw load retry policy
    preconditions: [isolated batch id]
    injection_method: fail first load attempt via injection hook (test-only parameter)
    expected_detection: RETRY recorded; eventual success or controlled failure
    expected_alert: none when recovered
    expected_containment: no duplicate rows after retry success
    allowed_data_impact: none
    recovery_action: RETRY_TASK
    verification_queries:
      - raw count equals 50000 exactly; zero duplicate event_ids
    cleanup: none
    recurrence_prevention: load idempotency test (existing WRITE_TRUNCATE-per-batch semantics)
    execution_mode: unit
    evidence_hint: tests/unit/test_failure_injection.py transient-retry coverage
    maximum_cost_usd: 0.05

  S6-ING-008:
    category: INGESTION
    description: Retry exhaustion reaches terminal FAILED and blocks downstream
    risk_level: MEDIUM
    target_component: task retry policy + failure propagation
    preconditions: [isolated batch id]
    injection_method: persistent failure injection (all attempts fail)
    expected_detection: attempts exhausted; task FAILED; downstream UPSTREAM_FAILED; run FAILED
    expected_alert: "Atlas: pipeline failed"
    expected_containment: no publication; terminal audit rows recorded
    allowed_data_impact: none
    recovery_action: RERUN_BATCH
    verification_queries:
      - pipeline_runs FAILED for injected run; SUCCESS for recovery run
    cleanup: remove injection flag
    recurrence_prevention: failure-propagation tests (existing Sprint 3)
    execution_mode: live
    maximum_cost_usd: 0.10

  # ------------------------------------------------------------- ORCHESTRATION
  S6-AIR-001:
    category: ORCHESTRATION
    description: Worker interruption mid-task is retryable without duplication
    risk_level: MEDIUM
    target_component: Airflow task execution
    preconditions: [isolated batch id, safe task]
    injection_method: kill the task process mid-execution (isolated batch only)
    expected_detection: attempt marked failed/retry; no silent RUNNING state
    expected_alert: none when retry recovers
    expected_containment: rerun does not duplicate data
    allowed_data_impact: none
    recovery_action: RETRY_TASK
    verification_queries:
      - task_events shows interrupted attempt + successful retry
      - raw/fact counts exact after recovery
    cleanup: none
    recurrence_prevention: idempotent step design (existing)
    execution_mode: live
    maximum_cost_usd: 0.10

  S6-AIR-002:
    category: ORCHESTRATION
    description: Task timeout is classified and blocks downstream publication
    risk_level: LOW
    target_component: execution_timeout policy
    preconditions: [isolated batch id]
    injection_method: injected sleep beyond a drill-scoped execution_timeout
    expected_detection: timeout failure recorded with correct classification
    expected_alert: 'Atlas: pipeline failed when run terminal-fails'
    expected_containment: downstream tasks do not publish
    allowed_data_impact: none
    recovery_action: RERUN_BATCH
    verification_queries:
      - task_events FAILED with timeout error_type for injected task
    cleanup: remove drill timeout override
    recurrence_prevention: timeout policy documented per task
    execution_mode: live
    maximum_cost_usd: 0.05

  S6-AIR-003:
    category: ORCHESTRATION
    description: Finalizer failure leaves reconstructable operational truth
    risk_level: HIGH
    target_component: write_run_summary finalizer
    preconditions: [isolated batch id]
    injection_method: fail the finalizer write path via injection hook
    expected_detection: missing/incomplete finalization detected; no false SUCCESS
    expected_alert: "Atlas: telemetry incomplete"
    expected_containment: pipeline data state remains truthful
    allowed_data_impact: none
    recovery_action: RECONSTRUCT_AUDIT
    verification_queries:
      - reconstructed pipeline_runs row matches Airflow + GCS + BigQuery evidence
      - recovery_actions row RECONSTRUCT_AUDIT SUCCESS VERIFIED
    cleanup: remove injection hook
    recurrence_prevention: finalizer reconciliation tests (existing) + reconstruction runbook
    execution_mode: live
    maximum_cost_usd: 0.10

  S6-AIR-004:
    category: ORCHESTRATION
    description: Overlapping runs are controlled; same batch stays idempotent
    risk_level: MEDIUM
    target_component: DAG max_active_runs / batch identity
    preconditions: [isolated batch ids]
    injection_method: trigger concurrent runs (distinct batches, then same batch)
    expected_detection: concurrency settings serialize unsafe overlap
    expected_alert: none
    expected_containment: no cross-batch interference; same-batch rerun idempotent
    allowed_data_impact: none
    recovery_action: RESET_MONITOR
    verification_queries:
      - per-batch counts exact; fact uniqueness holds across both batches
    cleanup: delete isolated batches
    recurrence_prevention: DAG concurrency configuration tests
    execution_mode: live
    maximum_cost_usd: 0.20

  S6-AIR-005:
    category: ORCHESTRATION
    description: Invalid run context fails before any mutation
    risk_level: LOW
    target_component: resolve_run_context validation
    preconditions: []
    injection_method: supply invalid batch id / date / seed via dagrun conf
    expected_detection: resolve_run_context raises before any cloud mutation
    expected_alert: none required
    expected_containment: zero writes to GCS/BigQuery/audit beyond the failed context task
    allowed_data_impact: none
    recovery_action: MANUAL_CONTAINMENT
    verification_queries:
      - no pipeline_runs/raw rows exist for the invalid identifiers
    cleanup: none
    recurrence_prevention: context validation unit tests
    execution_mode: both
    evidence_hint: tests/unit/test_run_context.py + live invalid-conf trigger
    maximum_cost_usd: 0.01

  S6-AIR-006:
    category: ORCHESTRATION
    description: Scheduler interruption / missed run is visible and recoverable
    risk_level: MEDIUM
    target_component: schedule + freshness monitor
    preconditions: [monitoring_enabled true, drill threshold override]
    injection_method: paused schedule window with drill-scoped freshness threshold
    expected_detection: monitor missing-run/stale check FAIL
    expected_alert: "Atlas: data stale"
    expected_containment: bounded backfill only; no unbounded catch-up
    allowed_data_impact: none
    recovery_action: BACKFILL
    verification_queries:
      - monitor_evaluations FAIL then PASS after bounded backfill
    cleanup: restore threshold; resume schedule
    recurrence_prevention: freshness monitor (existing Sprint 5)
    execution_mode: live
    maximum_cost_usd: 0.20

  # ----------------------------------------------------------------- WAREHOUSE
  S6-DBT-001:
    category: WAREHOUSE
    description: Source freshness failure blocks scheduled run, not backfills
    risk_level: LOW
    target_component: dbt source freshness gate
    preconditions: [isolated batch id]
    injection_method: stale source window against drill filter (no canonical mutation)
    expected_detection: dbt source freshness error blocks the scheduled path
    expected_alert: 'Atlas: pipeline failed when run terminal-fails'
    expected_containment: no build executes after failed freshness
    allowed_data_impact: none
    recovery_action: BACKFILL
    verification_queries:
      - backfill_mode run skips freshness by documented policy and reconciles
    cleanup: restore freshness config
    recurrence_prevention: freshness policy documented (Sprint 3 backfill semantics)
    execution_mode: live
    maximum_cost_usd: 0.10

  S6-DBT-002:
    category: WAREHOUSE
    description: dbt test failure blocks publication and recovers on clean rerun
    risk_level: LOW
    target_component: dbt build gate
    preconditions: [isolated batch id]
    injection_method: existing controlled inject_failure dbt var
    expected_detection: dbt build fails; run FAILED; incident opens
    expected_alert: "Atlas: pipeline failed"
    expected_containment: no success marker; marts unchanged
    allowed_data_impact: none
    recovery_action: RERUN_BATCH
    verification_queries:
      - recovery run SUCCESS with 10/10 quality checks PASS
    cleanup: rerun without injection var
    recurrence_prevention: proven in Sprint 5 Drill B; regression retained
    execution_mode: live
    maximum_cost_usd: 0.10

  S6-DBT-003:
    category: WAREHOUSE
    description: Referential-integrity failure is traceable, publication blocked
    risk_level: MEDIUM
    target_component: dbt relationship tests
    preconditions: [isolated fixture dataset]
    injection_method: fixture rows with dangling foreign keys in isolated schema
    expected_detection: relationship test fails against fixture target
    expected_alert: 'Atlas: reconciliation failed (when routed through monitor)'
    expected_containment: invalid rows traceable; no incorrect mart publication
    allowed_data_impact: fixture dataset only
    recovery_action: QUARANTINE_BATCH
    verification_queries:
      - failing rows enumerated by stored test query; canonical marts untouched
    cleanup: drop fixture dataset
    recurrence_prevention: relationship tests (existing) + fixture regression
    execution_mode: live
    approval_required: [ATLAS_APPROVE_FAILURE_INJECTION, ATLAS_APPROVE_DESTRUCTIVE_FIXTURE]
    maximum_cost_usd: 0.10

  S6-DBT-004:
    category: WAREHOUSE
    description: Duplicate fact event is blocked by uniqueness protection
    risk_level: MEDIUM
    target_component: fct_events uniqueness grain
    preconditions: [isolated fixture dataset]
    injection_method: duplicate event_id rows in isolated fixture target
    expected_detection: uniqueness test fails
    expected_alert: 'Atlas: reconciliation failed (fixture-scoped)'
    expected_containment: fact grain protected; canonical facts unchanged
    allowed_data_impact: fixture dataset only
    recovery_action: REPAIR_PARTIAL_LOAD
    verification_queries:
      - fixture duplicate removed; uniqueness test passes; canonical counts unchanged
    cleanup: drop fixture dataset
    recurrence_prevention: uniqueness tests (existing)
    execution_mode: live
    approval_required: [ATLAS_APPROVE_FAILURE_INJECTION, ATLAS_APPROVE_DESTRUCTIVE_FIXTURE]
    maximum_cost_usd: 0.10

  S6-DBT-005:
    category: WAREHOUSE
    description: Late-arriving events included by bounded backfill without duplication
    risk_level: MEDIUM
    target_component: incremental models + backfill path
    preconditions: [two isolated batches]
    injection_method: initial batch, then delayed additional batch for a prior date
    expected_detection: n/a (planned flow); freshness policy honored
    expected_alert: none
    expected_containment: unaffected history byte-identical; no duplicate facts
    allowed_data_impact: isolated batches only
    recovery_action: BACKFILL
    verification_queries:
      - late events present; prior batches unchanged; fact uniqueness; mart reconciliation
    cleanup: delete isolated batches
    recurrence_prevention: backfill regression (existing Sprint 3) + late-data evidence
    execution_mode: live
    maximum_cost_usd: 0.20

  S6-DBT-006:
    category: WAREHOUSE
    description: Incremental target corruption detected and repaired, not full-refreshed
    risk_level: HIGH
    target_component: incremental model targets
    preconditions: [isolated schema copy, ATLAS_APPROVE_DESTRUCTIVE_FIXTURE]
    injection_method: mutate rows in an isolated copy of an incremental target
    expected_detection: batch-scoped reconciliation FAIL against the isolated target
    expected_alert: 'Atlas: reconciliation failed (fixture-scoped)'
    expected_containment: corruption bounded to isolated schema
    allowed_data_impact: isolated schema only
    recovery_action: REBUILD_PARTITION
    verification_queries:
      - repaired target matches source-of-truth rebuild for affected batch only
    cleanup: drop isolated schema
    recurrence_prevention: reconciliation checks (existing) + targeted-repair runbook
    execution_mode: live
    approval_required: [ATLAS_APPROVE_FAILURE_INJECTION, ATLAS_APPROVE_DESTRUCTIVE_FIXTURE]
    maximum_cost_usd: 0.20

  S6-DBT-007:
    category: WAREHOUSE
    description: Partition rebuild touches only the intended partition
    risk_level: MEDIUM
    target_component: partitioned raw/fact tables (isolated copies)
    preconditions: [isolated fixture partitioned table]
    injection_method: rebuild one partition of the isolated table
    expected_detection: n/a (controlled maintenance flow)
    expected_alert: none
    expected_containment: other partitions byte-identical (count + checksum)
    allowed_data_impact: isolated fixture only
    recovery_action: REBUILD_PARTITION
    verification_queries:
      - non-target partition row counts/checksums unchanged; downstream reconciles
    cleanup: drop fixture table
    recurrence_prevention: bounded-rebuild runbook + recovery audit
    execution_mode: live
    approval_required: [ATLAS_APPROVE_FAILURE_INJECTION, ATLAS_APPROVE_DESTRUCTIVE_FIXTURE]
    maximum_cost_usd: 0.20

  # -------------------------------------------------------------------- SCHEMA
  S6-SCH-001:
    category: SCHEMA
