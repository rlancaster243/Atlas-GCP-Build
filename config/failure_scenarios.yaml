    risk_level: LOW
    target_component: schema-drift classifier + migration path
    preconditions: [fixture table or manifest override]
    injection_method: add configured nullable field to fixture; allowed_new_fields entry
    expected_detection: drift finding ALLOWED approved_new_field
    expected_alert: none
    expected_containment: older consumers keep working
    allowed_data_impact: fixture only
    recovery_action: FORWARD_MIGRATION
    verification_queries: [classifier output ALLOWED for the configured field]
    cleanup: drop fixture
    recurrence_prevention: classifier unit tests
    execution_mode: both
    evidence_hint: tests/unit/test_schema_drift.py
    maximum_cost_usd: 0.05

